# Installed by K-Git Studio. Run it from the Builds tab.
name: K-Git Build

on:
  workflow_dispatch:
    inputs:
      build_type:
        description: 'What to build'
        required: true
        default: apk
        type: choice
        options:
          - apk
          - aab
          - both

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Flutter (stable)
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Generate Android host project (if missing)
        run: |
          set -euo pipefail
          if [ ! -d android ]; then
            flutter create --platforms=android --project-name calculator --org com.mycompany /tmp/kgit_scaffold
            cp -r /tmp/kgit_scaffold/android ./android
          fi

      - name: Ensure Android internet permission
        run: |
          python3 - <<'PYCODE'
          from pathlib import Path
          import re
          manifest = Path("android/app/src/main/AndroidManifest.xml")
          content = manifest.read_text(encoding="utf-8")
          if 'android.permission.INTERNET' not in content:
              match = re.search(r'<manifest\b[^>]*>', content)
              content = content[:match.end()] + '\n    <uses-permission android:name="android.permission.INTERNET"/>' + content[match.end():]
              manifest.write_text(content, encoding="utf-8")
          print("INTERNET permission verified.")
          PYCODE

      - name: Install dependencies
        run: flutter pub get

      - name: Analyze (non-blocking)
        run: flutter analyze
        continue-on-error: true

      - name: Build APK
        if: ${{ inputs.build_type == 'apk' || inputs.build_type == 'both' }}
        run: flutter build apk --release --build-number "$GITHUB_RUN_NUMBER"

      - name: Build AAB
        if: ${{ inputs.build_type == 'aab' || inputs.build_type == 'both' }}
        run: flutter build appbundle --release --build-number "$GITHUB_RUN_NUMBER"

      - name: Upload APK
        if: ${{ inputs.build_type == 'apk' || inputs.build_type == 'both' }}
        uses: actions/upload-artifact@v4
        with:
          name: app-apk
          path: build/app/outputs/flutter-apk/app-release.apk
          retention-days: 14

      - name: Upload AAB
        if: ${{ inputs.build_type == 'aab' || inputs.build_type == 'both' }}
        uses: actions/upload-artifact@v4
        with:
          name: app-aab
          path: build/app/outputs/bundle/release/app-release.aab
          retention-days: 14
